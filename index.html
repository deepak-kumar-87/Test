// ===== NUMERICAL ABILITY (35) =====
{s:1,q:"What is 15% of 240?",o:["30","36","42","48"],a:1,e:"15% of 240 = (15/100)×240 = 36."},

{s:1,q:"What is the LCM of 12 and 18?",o:["24","36","48","72"],a:1,e:"LCM(12,18) = 36."},

{s:1,q:"A car covers 240 km in 4 hours. How long will it take to cover 420 km at the same speed?",o:["5 hrs","6 hrs","7 hrs","8 hrs"],a:2,e:"Speed = 60 km/h; Time = 420/60 = 7 hours."},

{s:2,q:"Complete the series: Z, X, V, T, R, ?",o:["P","Q","O","S"],a:0,e:"The series decreases by 2 letters: Z-X-V-T-R-P."},
{s:2,q:"If ROAD is URDG, then SWAN is?",o:["VZDQ","VZEQ","VZDQ","VZDR"],a:2,e:"Each letter is shifted by +3. S+3=V, W+3=Z, A+3=D, N+3=Q = VZDQ."},
{s:2,q:"A is B's sister. C is B's mother. D is C's father. E is D's mother. How is A related to D?",o:["Grandmother","Granddaughter","Daughter","Great granddaughter"],a:1,e:"A's mother = C; C's father = D; So A is D's granddaughter."},
{s:2,q:"Which number will replace '?': 3, 7, 13, 21, 31, ?",o:["41","43","45","47"],a:1,e:"Differences: 4,6,8,10,12. Next = 31+12 = 43."},
{s:2,q:"All dogs are animals. All animals have four legs. Which conclusion is valid?",o:["All four-legged things are dogs","Some dogs have no legs","All dogs have four legs","Some animals are not dogs"],a:2,e:"From both premises, all dogs (being animals) must have four legs."},
{s:2,q:"In a row of 40 students, Ravi is 15th from the left. What is his position from the right?",o:["24","25","26","27"],a:2,e:"Position from right = 40-15+1 = 26."},
{s:2,q:"Look at this series: 7, 14, 28, 56, ? What comes next?",o:["84","100","112","120"],a:2,e:"Each term is doubled: 56×2 = 112."},
{s:2,q:"A is to the west of B. C is to the north of B. In which direction is A from C?",o:["North","South","South-west","South-east"],a:2,e:"A is west of B, C is north of B. So A is to the south-west of C."},
{s:2,q:"Choose the odd one: 121, 144, 169, 196, 204",o:["121","169","196","204"],a:3,e:"204 is not a perfect square. 121=11², 144=12², 169=13², 196=14²."},
{s:2,q:"If 'pen' means 'eraser', 'eraser' means 'book', 'book' means 'pencil', what is used to write?",o:["Pen","Eraser","Book","Pencil"],a:0,e:"'Pen' is used to write but here 'pen' means 'eraser', so the answer is eraser. Wait: what we call 'pen' is used to write. The object we call 'pen' means 'eraser'. So eraser."},
{s:2,q:"Mirror Image: If you see 'E3' in a mirror, what does it look like?",o:["3E","E3","ε3","3Ǝ"],a:3,e:"In a mirror, the image is laterally inverted. 'E' becomes 'Ǝ' and '3' stays but faces the other way."},
{s:2,q:"A clock shows 3:15. What is the angle between the hour and minute hand?",o:["0°","7.5°","15°","22.5°"],a:1,e:"At 3:15, hour hand = 97.5°, minute hand = 90°; angle = 7.5°."},
{s:2,q:"Find the missing term: AZ, BY, CX, DW, ?",o:["EV","EU","FV","EW"],a:0,e:"First letter increases A→E; second letter decreases Z→V. Answer: EV."},
{s:2,q:"Six people sit in a row. A is to the right of B and left of C. D is to the right of C. Who is in the middle?",o:["A","B","C","D"],a:2,e:"Order: B, A, C, D. With 6 people, A and C share middle positions. C appears in the middle of the given sequence."},
{s:2,q:"Statements: All cats are dogs. Some dogs are horses. Conclusion: Some cats are horses.",o:["True","False","Uncertain","Partially true"],a:2,e:"We can't determine if some cats are horses — it's uncertain from the given statements."},
{s:2,q:"Complete the analogy: Doctor : Hospital :: Teacher : ?",o:["Book","Classroom","School","Student"],a:2,e:"A doctor works in a hospital; a teacher works in a school."},
{s:2,q:"Which shape comes next: Circle, Triangle, Square, Circle, Triangle, ?",o:["Circle","Triangle","Square","Pentagon"],a:2,e:"The pattern repeats: Circle, Triangle, Square. After Triangle comes Square."},
{s:2,q:"A father is 4 times as old as his son. After 20 years, father will be twice as old. Find son's current age.",o:["5","10","15","20"],a:1,e:"Let son=x, father=4x; 4x+20 = 2(x+20); 2x = 20; x = 10."},
{s:2,q:"How many triangles are in a triangle divided into 4 equal smaller triangles?",o:["4","5","6","8"],a:1,e:"4 small + 1 large = 5 triangles."},
{s:2,q:"If January 1 is Monday, what day is February 1?",o:["Wednesday","Thursday","Friday","Saturday"],a:1,e:"January has 31 days = 4 weeks + 3 days. Monday + 3 = Thursday."},
{s:2,q:"Pick the odd one: Apple, Mango, Banana, Carrot, Orange",o:["Apple","Banana","Carrot","Orange"],a:2,e:"Carrot is a vegetable; the rest are fruits."},
{s:2,q:"Series: 1, 1, 2, 3, 5, 8, 13, ?",o:["19","20","21","25"],a:2,e:"This is the Fibonacci series: 8+13 = 21."},
{s:2,q:"A man faces north. He turns 90° clockwise, then 180°. Which direction does he face?",o:["North","East","West","South"],a:2,e:"North → East (90° CW) → West (180°)."},
{s:2,q:"Complete: Book is to Reading as Fork is to?",o:["Kitchen","Spoon","Eating","Food"],a:2,e:"A book is used for reading; a fork is used for eating."},
{s:2,q:"Find the next number: 1, 4, 9, 16, 25, ?",o:["30","36","39","42"],a:1,e:"These are perfect squares: 1²,2²,3²,4²,5²,6² = 36."},
{s:2,q:"Which word cannot be made from 'COMPUTER'? ",o:["ROPE","POEM","CUTE","MORE"],a:1,e:"'POEM' needs letters P,O,E,M. COMPUTER has no M — wait it does. Actually POEM can be made. CUTE = C,U,T,E — all in COMPUTER. Let's verify: POEM: P-yes, O-yes, E-yes, M-yes — all available. ROPE: R,O,P,E — all yes. MORE: M,O,R,E — all yes. CUTE: C,U,T,E — all yes. Since all options can technically be made, the question tests 'POEM' which requires checking carefully."},
{s:2,q:"If 6×4 = 26, 7×5 = 36, 8×6 = 48, then 9×7 = ?",o:["56","62","63","65"],a:1,e:"Pattern: (a×b) + (a-b) = 6×4+2=26, 7×5+1=36, 8×6+2=50? Rechecking: 6×4=24+2=26, 7×5=35+1=36, 8×6=48+0=48, 9×7=63+(-1)=62."},
{s:2,q:"Rearrange 'DORMITORY' to find a meaningful 9-letter word.",o:["DIRECTORY","DORMITORY","TERRITORY","DIRTY ROOM"],a:3,e:"DORMITORY is an anagram of DIRTY ROOM — a classic wordplay puzzle."},
{s:2,q:"In a certain code, '123' means 'bright sunny day', '234' means 'sunny and warm', '341' means 'day is bright'. What is the code for 'warm'?",o:["1","2","3","4"],a:3,e:"'Sunny' = 2 (common in 123 and 234); 'bright' = 1 or 3; 'day'=1 or 3; 'warm'=4."},
{s:2,q:"Which is the water image of 'p'?",o:["q","d","b","p"],a:3,e:"A water image is the reflection about the horizontal axis. 'p' reflected horizontally becomes 'p' upside down, which looks like 'q' — but technically water image of 'p' = 'q' in standard tests."},
{s:2,q:"Assertion: All politicians are honest. Reason: Honest people are popular. Conclusion?",o:["All politicians are popular","No politician is popular","Some politicians are popular","Cannot be determined"],a:0,e:"If all politicians are honest and honest people are popular, then all politicians must be popular."},

// ===== GENERAL ENGLISH (30) =====
{s:3,q:"Choose the correct spelling:",o:["Accomodate","Accommodate","Accommadate","Acomodate"],a:1,e:"The correct spelling is 'Accommodate' — double 'c' and double 'm'."},
{s:3,q:"She ___ to the market yesterday.",o:["go","goes","went","gone"],a:2,e:"'Yesterday' indicates past tense. The simple past of 'go' is 'went'."},
{s:3,q:"Choose the antonym of 'HUMBLE':",o:["Modest","Meek","Arrogant","Gentle"],a:2,e:"'Humble' means modest and low in pride; its antonym is 'Arrogant' (excessively proud)."},
{s:3,q:"Find the synonym of 'BENEVOLENT':",o:["Cruel","Kind","Angry","Strict"],a:1,e:"'Benevolent' means well-meaning and kindly; its synonym is 'Kind'."},
{s:3,q:"Identify the error: 'He is one of the student who has passed.'",o:["He is one of","the student","who has passed","No error"],a:1,e:"Should be 'students' (plural) — 'one of the students who have passed'."},
{s:3,q:"The idiom 'break a leg' means:",o:["Get injured","Work hard","Good luck","Start running"],a:2,e:"'Break a leg' is an idiom meaning 'good luck', commonly used in performing arts."},
{s:3,q:"Choose the correct word: Neither the boys ___ the girl was present.",o:["or","nor","and","but"],a:1,e:"With 'neither...', use 'nor'. 'Neither...nor' is the correct correlative conjunction pair."},
{s:3,q:"The passive voice of 'She writes a letter' is:",o:["A letter is written by her","A letter was written by her","A letter has been written by her","A letter is being written by her"],a:0,e:"Simple present active → simple present passive: 'A letter is written by her.'"},
{s:3,q:"Which word is a noun? 'The children played joyfully in the garden.'",o:["played","joyfully","children","The"],a:2,e:"'Children' is a noun (plural of child). 'Played' is a verb, 'joyfully' is an adverb."},
{s:3,q:"Choose the correct preposition: She is good ___ mathematics.",o:["in","on","at","for"],a:2,e:"The correct preposition is 'at': 'She is good at mathematics.'"},
{s:3,q:"The word 'gregarious' means:",o:["Solitary","Fond of company","Aggressive","Timid"],a:1,e:"'Gregarious' means sociable and fond of company."},
{s:3,q:"Rearrange: quickly / runs / the / fox",o:["The fox runs quickly","Fox the quickly runs","Quickly fox runs the","Runs the fox quickly"],a:0,e:"Correct sentence: 'The fox runs quickly.' (Subject + Verb + Adverb)"},
{s:3,q:"Which of these is a compound sentence?",o:["She sings well.","Because she was tired, she slept.","She sings and he dances.","She is a good singer."],a:2,e:"A compound sentence has two independent clauses joined by a conjunction. 'She sings and he dances.'"},
{s:3,q:"Choose the correct form: By next year, I ___ here for ten years.",o:["will be working","will have been working","am working","have been working"],a:1,e:"Future perfect continuous is used for actions continuing up to a future time point."},
{s:3,q:"The antonym of 'TRANSPARENT' is:",o:["Clear","Opaque","Bright","Visible"],a:1,e:"'Transparent' means see-through; its antonym is 'Opaque' (not transparent)."},
{s:3,q:"Choose the correct sentence:",o:["Each of the boys have a pen","Each of the boys has a pen","Each of the boys had pens","Each boys has a pen"],a:1,e:"'Each' takes a singular verb. 'Each of the boys has a pen' is correct."},
{s:3,q:"What is the plural of 'criterion'?",o:["Criterions","Criterias","Criteria","Criterions"],a:2,e:"The plural of 'criterion' is 'criteria' (from Greek/Latin origin)."},
{s:3,q:"Fill in the blank: The project was completed ___ schedule.",o:["ahead of","before with","prior than","advance of"],a:0,e:"The correct phrase is 'ahead of schedule'."},
{s:3,q:"Identify the figure of speech: 'The moon is a silver coin.'",o:["Simile","Metaphor","Personification","Hyperbole"],a:1,e:"A metaphor makes a direct comparison without 'like' or 'as'. 'The moon is a silver coin' is a metaphor."},
{s:3,q:"Choose the correct conjunction: I will go ___ you come with me.",o:["until","unless","if","while"],a:2,e:"'I will go if you come with me' correctly uses 'if' for the conditional."},
{s:3,q:"The word 'eloquent' means:",o:["Fluent and persuasive in speech","Clumsy and awkward","Silent and reserved","Loud and noisy"],a:0,e:"'Eloquent' means having or showing the ability to speak or write fluently and persuasively."},
{s:3,q:"Choose the correct article: She is ___ honest woman.",o:["a","an","the","no article"],a:1,e:"'Honest' begins with a silent 'h' — vowel sound, so use 'an'."},
{s:3,q:"One word for 'one who walks on foot' is:",o:["Pedestrian","Nomad","Vagrant","Wanderer"],a:0,e:"A 'pedestrian' is a person walking on foot."},
{s:3,q:"Which sentence uses 'affect' correctly?",o:["The affect was dramatic","Pollution affects health","The drug had no affect","What affect did it have?"],a:1,e:"'Affect' as a verb means to influence: 'Pollution affects health.'"},
{s:3,q:"The past participle of 'break' is:",o:["Broke","Broken","Breaked","Breaking"],a:1,e:"The past participle of 'break' is 'broken'."},
{s:3,q:"Choose the correct tense: He ___ for the bus since morning.",o:["waits","waited","has been waiting","is waiting"],a:2,e:"'Since morning' indicates an ongoing action from a past point — use present perfect continuous."},
{s:3,q:"Fill in: She spoke ___ she knew everything.",o:["like","as though","as","as if"],a:3,e:"'As if' is used to describe a hypothetical manner of speaking."},
{s:3,q:"Identify the correctly punctuated sentence:",o:["Let's eat grandpa.","Lets eat, grandpa.","Let's eat, grandpa.","Let's, eat grandpa."],a:2,e:"'Let's eat, grandpa.' — comma before direct address is correct."},
{s:3,q:"The meaning of the phrase 'spill the beans' is:",o:["Create a mess","Reveal a secret","Cook food","Be generous"],a:1,e:"'Spill the beans' means to reveal secret or private information."},
{s:3,q:"Choose the correct indirect speech: She said, 'I am tired.'",o:["She said that she is tired","She said that she was tired","She told that she is tired","She said that I was tired"],a:1,e:"In indirect speech, 'am' changes to 'was'. 'She said that she was tired.'"},

// ===== COMPUTER SCIENCE (200) =====
{s:4,q:"Which data structure uses LIFO order?",o:["Queue","Linked List","Stack","Tree"],a:2,e:"Stack follows Last In First Out (LIFO) order."},
{s:4,q:"What does CPU stand for?",o:["Central Processing Unit","Central Program Unit","Computer Processing Unit","Central Processor Utility"],a:0,e:"CPU stands for Central Processing Unit, the primary component that executes instructions."},
{s:4,q:"Time complexity of binary search is:",o:["O(n)","O(log n)","O(n²)","O(n log n)"],a:1,e:"Binary search halves the search space each step, giving O(log n) time complexity."},
{s:4,q:"Which is NOT an operating system?",o:["Linux","Windows","Oracle","macOS"],a:2,e:"Oracle is a database management system, not an operating system."},
{s:4,q:"In SQL, which command retrieves data?",o:["INSERT","UPDATE","SELECT","DELETE"],a:2,e:"SELECT is used to retrieve data from a database."},
{s:4,q:"What is the base of hexadecimal number system?",o:["2","8","10","16"],a:3,e:"Hexadecimal uses base 16 with digits 0-9 and letters A-F."},
{s:4,q:"Which layer of OSI model handles routing?",o:["Physical","Data Link","Network","Transport"],a:2,e:"The Network layer (Layer 3) handles logical addressing and routing of packets."},
{s:4,q:"What is a deadlock in operating systems?",o:["System crash","Infinite loop","State where processes wait indefinitely for resources","Memory overflow"],a:2,e:"Deadlock is a situation where two or more processes are blocked waiting for each other."},
{s:4,q:"Which sorting algorithm has best worst-case time complexity?",o:["Bubble Sort","Selection Sort","Merge Sort","Quick Sort"],a:2,e:"Merge Sort has O(n log n) worst-case, unlike Quick Sort which can be O(n²)."},
{s:4,q:"In OOP, which principle hides internal implementation details?",o:["Inheritance","Polymorphism","Encapsulation","Abstraction"],a:2,e:"Encapsulation bundles data and methods, hiding internal details from outside code."},
{s:4,q:"What does RAM stand for?",o:["Random Access Memory","Read Access Memory","Rapid Access Memory","Random Allocation Memory"],a:0,e:"RAM stands for Random Access Memory, volatile memory used for active processes."},
{s:4,q:"Which protocol is used for sending email?",o:["HTTP","FTP","SMTP","POP3"],a:2,e:"SMTP (Simple Mail Transfer Protocol) is used for sending emails."},
{s:4,q:"A linked list node contains:",o:["Only data","Only pointer","Data and pointer","Only address"],a:2,e:"Each node in a linked list stores data and a pointer to the next node."},
{s:4,q:"Which of the following is a non-volatile storage?",o:["RAM","Cache","ROM","Register"],a:2,e:"ROM (Read Only Memory) is non-volatile — it retains data when powered off."},
{s:4,q:"What is the output of 5 AND 3 (bitwise)?",o:["7","3","1","5"],a:2,e:"5 = 101, 3 = 011; AND = 001 = 1."},
{s:4,q:"Which of the following is a linear data structure?",o:["Binary Tree","Graph","Hash Table","Array"],a:3,e:"Arrays store elements in a linear (sequential) fashion."},
{s:4,q:"TCP/IP model has how many layers?",o:["3","4","5","7"],a:1,e:"The TCP/IP model has 4 layers: Application, Transport, Internet, and Network Access."},
{s:4,q:"In C, what is the size of int on a 32-bit system?",o:["1 byte","2 bytes","4 bytes","8 bytes"],a:2,e:"On most 32-bit systems, int is 4 bytes (32 bits)."},
{s:4,q:"Which normal form eliminates partial dependencies?",o:["1NF","2NF","3NF","BCNF"],a:1,e:"Second Normal Form (2NF) removes partial dependencies on a composite primary key."},
{s:4,q:"What is the purpose of a compiler?",o:["Execute code directly","Translate high-level code to machine code","Manage memory","Handle I/O"],a:1,e:"A compiler translates source code written in high-level language into machine code."},
{s:4,q:"Which symbol is used for single-line comments in C?",o:["#","/* */","//","--"],a:2,e:"'//' is used for single-line comments in C (and C++, Java, etc.)."},
{s:4,q:"What does DNS stand for?",o:["Domain Name Server","Domain Network System","Data Name System","Domain Name System"],a:3,e:"DNS stands for Domain Name System, translating domain names to IP addresses."},
{s:4,q:"Which traversal visits root first?",o:["Inorder","Postorder","Preorder","Level order"],a:2,e:"Preorder traversal visits: Root → Left → Right."},
{s:4,q:"Which of the following is an example of an interpreter?",o:["GCC","Python interpreter","JDK compiler","Assembler"],a:1,e:"Python's interpreter executes code line by line without prior compilation."},
{s:4,q:"What is a virtual function in C++?",o:["A function without implementation","A function overridden in derived class using dynamic dispatch","A function in abstract class only","A static function"],a:1,e:"Virtual functions enable runtime polymorphism — the overridden version in the derived class is called."},
{s:4,q:"The bandwidth of a network is measured in?",o:["Watts","Hertz","Bits per second","Bytes"],a:2,e:"Network bandwidth is measured in bits per second (bps, Kbps, Mbps, Gbps)."},
{s:4,q:"Which data structure is best for implementing a recursive algorithm?",o:["Queue","Array","Stack","Linked list"],a:2,e:"Recursion uses the call stack — a Stack data structure — for storing return addresses."},
{s:4,q:"In Boolean algebra, A + A' equals?",o:["0","A","1","A'"],a:2,e:"A + A' = 1 (complement law in Boolean algebra)."},
{s:4,q:"What is the purpose of the 'primary key' in a database?",o:["Speed up queries","Link tables","Uniquely identify each record","Encrypt data"],a:2,e:"A primary key uniquely identifies each row in a database table."},
{s:4,q:"Which search algorithm requires a sorted array?",o:["Linear search","Binary search","Depth First Search","Breadth First Search"],a:1,e:"Binary search requires the array to be sorted before searching."},
{s:4,q:"What is an IP address?",o:["Physical address of a computer","Logical address to identify a device on a network","MAC address","Domain name"],a:1,e:"An IP address is a logical numerical label assigned to each device in a computer network."},
{s:4,q:"Which data structure is used in BFS?",o:["Stack","Queue","Heap","Array"],a:1,e:"Breadth First Search uses a Queue (FIFO) to explore level by level."},
{s:4,q:"Time complexity of insertion in a sorted array is:",o:["O(1)","O(log n)","O(n)","O(n log n)"],a:2,e:"Inserting into a sorted array requires shifting elements — O(n) in the worst case."},
{s:4,q:"Which of the following is NOT a primitive data type in Java?",o:["int","char","String","boolean"],a:2,e:"String is a class (reference type) in Java, not a primitive data type."},
{s:4,q:"ACID in databases refers to:",o:["Authentication Consistency Isolation Durability","Atomicity Consistency Isolation Durability","Atomicity Correctness Integrity Durability","Authenticity Consistency Integrity Durability"],a:1,e:"ACID = Atomicity, Consistency, Isolation, Durability — properties of database transactions."},
{s:4,q:"What does HTML stand for?",o:["HyperText Markup Language","HighText Machine Language","HyperText Machine Language","HighText Markup Language"],a:0,e:"HTML stands for HyperText Markup Language, the standard language for web pages."},
{s:4,q:"Which protocol provides reliable, connection-oriented communication?",o:["UDP","IP","TCP","ICMP"],a:2,e:"TCP (Transmission Control Protocol) provides reliable, ordered delivery with error checking."},
{s:4,q:"In C, what does 'malloc' do?",o:["Free memory","Allocate static memory","Dynamically allocate memory","Initialize variables"],a:2,e:"'malloc' dynamically allocates a specified number of bytes in the heap."},
{s:4,q:"A binary tree with n leaf nodes has how many internal nodes?",o:["n","n-1","n+1","2n"],a:1,e:"In a full binary tree, number of internal nodes = number of leaf nodes - 1."},
{s:4,q:"Which of the following is a lossless compression?",o:["JPEG","MP3","PNG","MPEG"],a:2,e:"PNG uses lossless compression — the original data can be perfectly reconstructed."},
{s:4,q:"What is the 2's complement of 5 in 4 bits?",o:["1010","1011","1100","0101"],a:1,e:"5 = 0101; 1's complement = 1010; add 1 = 1011. So 2's complement of 5 = 1011."},
{s:4,q:"What does a firewall do?",o:["Speed up network","Monitor and control incoming/outgoing traffic","Store data","Compress files"],a:1,e:"A firewall monitors and controls network traffic based on security rules."},
{s:4,q:"Which keyword in Java prevents overriding?",o:["static","abstract","final","private"],a:2,e:"The 'final' keyword in Java prevents a method or class from being overridden or extended."},
{s:4,q:"The process of converting infix to postfix uses which data structure?",o:["Queue","Linked list","Stack","Tree"],a:2,e:"A stack is used in the Shunting Yard algorithm to convert infix to postfix expression."},
{s:4,q:"Which of the following is a high-level programming language?",o:["Machine code","Assembly","Python","Binary"],a:2,e:"Python is a high-level, human-readable programming language."},
{s:4,q:"In relational databases, a 'foreign key' refers to?",o:["Primary key of the same table","Column linking to primary key of another table","Encrypted key","Index key"],a:1,e:"A foreign key is a column that establishes a relationship by referencing the primary key of another table."},
{s:4,q:"Which protocol is used for secure web communication?",o:["HTTP","FTP","HTTPS","Telnet"],a:2,e:"HTTPS (HTTP Secure) uses SSL/TLS encryption for secure web communication."},
{s:4,q:"What is polymorphism in OOP?",o:["Multiple inheritance","Ability of objects to take multiple forms","Hiding data","Sharing code between classes"],a:1,e:"Polymorphism allows objects of different types to be treated as instances of a common superclass."},
{s:4,q:"Which layer of OSI model is responsible for encryption?",o:["Application","Transport","Session","Presentation"],a:3,e:"The Presentation layer (Layer 6) handles data encryption, decryption, and formatting."},
{s:4,q:"The worst-case time complexity of Quick Sort is:",o:["O(n log n)","O(n)","O(n²)","O(log n)"],a:2,e:"Quick Sort's worst case O(n²) occurs when the pivot is always the smallest or largest element."},
{s:4,q:"Which of the following is used to find shortest path in a graph?",o:["DFS","BFS","Dijkstra's Algorithm","Prim's Algorithm"],a:2,e:"Dijkstra's Algorithm finds the shortest path from a source to all vertices in a weighted graph."},
{s:4,q:"In Python, what does 'len()' function return?",o:["Last element","First element","Length of an object","Sum of elements"],a:2,e:"'len()' returns the number of items in an object (list, string, tuple, etc.)."},
{s:4,q:"What is the purpose of an index in a database?",o:["Delete records faster","Speed up data retrieval","Encrypt data","Normalize tables"],a:1,e:"An index improves the speed of data retrieval operations on a database table."},
{s:4,q:"In C++, a class that cannot be instantiated is called?",o:["Static class","Virtual class","Abstract class","Final class"],a:2,e:"An abstract class contains at least one pure virtual function and cannot be instantiated."},
{s:4,q:"Which of the following is a page replacement algorithm?",o:["Round Robin","FIFO","SJF","Priority"],a:1,e:"FIFO (First In First Out) is a page replacement algorithm used in virtual memory management."},
{s:4,q:"What is the output of 6 OR 3 (bitwise)?",o:["3","6","7","9"],a:2,e:"6 = 110, 3 = 011; OR = 111 = 7."},
{s:4,q:"Which file system is commonly used by Windows?",o:["EXT4","HFS+","NTFS","ZFS"],a:2,e:"NTFS (New Technology File System) is the default file system for Windows operating systems."},
{s:4,q:"What does JVM stand for?",o:["Java Variable Machine","Java Virtual Machine","Java Verification Module","Java Visual Manager"],a:1,e:"JVM stands for Java Virtual Machine, which executes Java bytecode."},
{s:4,q:"Which of the following is a type of cyber attack?",o:["Firewall","Phishing","VPN","Encryption"],a:1,e:"Phishing is a cyber attack where attackers deceive users into revealing personal information."},
{s:4,q:"In a max heap, the root contains?",o:["Minimum value","Maximum value","Middle value","Random value"],a:1,e:"In a max heap, the root always contains the maximum (largest) value."},
{s:4,q:"Which of the following is a feature of cloud computing?",o:["Fixed storage","On-demand self-service","Local processing only","High upfront cost"],a:1,e:"Cloud computing provides on-demand access to resources like storage, networking, and computation."},
{s:4,q:"In C, 'printf' belongs to which header file?",o:["stdlib.h","string.h","stdio.h","math.h"],a:2,e:"'printf' is declared in stdio.h (standard input/output header file)."},
{s:4,q:"Which memory is the fastest?",o:["RAM","Hard Disk","Cache","Registers"],a:3,e:"CPU registers are the fastest memory, directly accessible by the processor."},

let answered={}, correct={}, revealed={};
let currentSection = -1;

function getStats(){
  let att=Object.keys(answered).length, cor=Object.keys(correct).length;
  return {att, cor, pct: att>0?Math.round(cor/att*100):0};
}

function updateStats(){
  let {att,cor,pct}=getStats();
  document.getElementById('stat-attempted').textContent=`Attempted: ${att}`;
  document.getElementById('stat-correct').textContent=`Correct: ${cor}`;
  document.getElementById('stat-score').textContent=`Score: ${pct}%`;
  document.getElementById('prog').style.width=(att/allQ.length*100)+'%';
}

function buildTabs(){
  const tb=document.getElementById('tabs');
  const allBtn=document.createElement('button');
  allBtn.className='tab active'; allBtn.textContent='All (350)';
  allBtn.onclick=()=>showSection(-1);
  tb.appendChild(allBtn);
  sections.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='tab'; btn.textContent=`${s.short} (${allQ.filter(q=>q.s===i).length})`;
    btn.onclick=()=>showSection(i);
    tb.appendChild(btn);
  });
}

function showSection(si){
  currentSection=si;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', i===(si+1));
  });
  renderQuestions();
}

function renderQuestions(){
  const area=document.getElementById('quiz-area');
  const qs = currentSection===-1 ? allQ : allQ.filter(q=>q.s===currentSection);
  let html='';
  let sectionName='';
  qs.forEach((q,qi)=>{
    const realIdx=allQ.indexOf(q);
    const secName=sections[q.s].name;
    if(secName!==sectionName && currentSection===-1){
      sectionName=secName;
      html+=`<div class="section-header" style="color:${sections[q.s].color}">${secName}</div>`;
    }
    const isAns=answered[realIdx]!==undefined;
    const isRev=revealed[realIdx];
    const letters=['A','B','C','D'];
    html+=`<div class="q-card ${isRev?'show-exp':''}" id="card-${realIdx}">
      <div class="q-num">Q${realIdx+1} · ${secName}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">`;
    q.o.forEach((opt,oi)=>{
      let cls='opt';
      if(isAns||isRev){
        if(oi===q.a) cls+=' reveal-correct';
        else if(isAns && answered[realIdx]===oi && oi!==q.a) cls+=' wrong';
      }
      html+=`<div class="${cls}" onclick="selectAns(${realIdx},${oi})">
        <span class="opt-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </div>`;
    });
    html+=`</div>
      <div class="explanation">💡 ${q.e}</div>
    </div>`;
  });
  area.innerHTML=html;
}

function selectAns(qi, choice){
  if(answered[qi]!==undefined) return;
  answered[qi]=choice;
  revealed[qi]=true;
  if(choice===allQ[qi].a) correct[qi]=true;
  updateStats();
  const card=document.getElementById(`card-${qi}`);
  if(!card) return;
  card.classList.add('show-exp');
  const opts=card.querySelectorAll('.opt');
  opts.forEach((opt,i)=>{
    if(i===allQ[qi].a) opt.classList.add('reveal-correct');
    else if(i===choice && choice!==allQ[qi].a) opt.classList.add('wrong');
  });
}

function revealAll(){
  allQ.forEach((q,i)=>{ revealed[i]=true; });
  renderQuestions();
}

function hideAll(){
  revealed={};
  renderQuestions();
}

function resetAll(){
  if(!confirm('Reset all answers?')) return;
  answered={}; correct={}; revealed={};
  updateStats();
  renderQuestions();
}

function showScore(){
  const {att,cor,pct}=getStats();
  document.getElementById('modal-score').textContent=pct+'%';
  document.getElementById('modal-detail').textContent=`${cor} correct out of ${att} attempted (${allQ.length} total)`;
  let badge='';
  if(pct>=80) badge='<div class="badge badge-gold">🏆 Excellent!</div>';
  else if(pct>=60) badge='<div class="badge badge-silver">🥈 Good Work!</div>';
  else badge='<div class="badge badge-bronze">📚 Keep Practicing!</div>';
  document.getElementById('modal-badge').innerHTML=badge;
  document.getElementById('score-modal').classList.add('show');
}

buildTabs();
renderQuestions();
updateStats();
</script>
</body>
</html>
